task:
  name: "g1_task3_whole_body_locomotion"
  robot: "Unitree G1"
  project_type: "educational pure-RL baseline"
  description: >
    Task3 extends Task2 omni-directional locomotion to whole-body coordination.
    It keeps the same 23-DoF action space and 123-D observation space, but adds
    arm swing references, arm-leg synchronization, staged upper-body action gain,
    and whole-body style reward terms.

assets:
  usd_path_env: "G1_USD_PATH"
  motion_file_env: "G1_TASK3_MOTION_FILE"
  default_usd_path: "/home/lw/IsaacLab/tutorials/03_humanoid_basics/g1.usd"
  default_motion_file: "/home/lw/IsaacLab/tutorials/03_humanoid_basics/g1_whole_body_walk.pt"

robot:
  total_joints_in_usd: 25
  sensor_joints:
    - "xl330_joint"
    - "d455_joint"
  controlled_joint_dim: 23
  action_dim: 23
  observation_dim: 123
  frame_stack: 5
  stacked_observation_dim: 615

motion_file_required_keys:
  - "pos"
  - "vel"
  - "cmd"
  - "num_frames"
  - "phase"
  - "contact_ref"
  - "mode_id"
  - "mode_names"
  - "joint_names"
  - "arm_swing_ref"

notes:
  - "This is an educational pure-RL whole-body baseline."
  - "It is not HoloSoma, OmniRetarget, BeyondMimic, AMP, or motion imitation pipeline."
  - "Task3 should usually warm-start from Task2 if available."
